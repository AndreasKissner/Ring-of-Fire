<div class="field">
    <div class="card-stack">
        @for (c of [0, 1, 2, 3, 4]; track c; let i = $index) {
        <img [ngStyle]="{ 'right.px': i * 5 }" src="assets/img/cards/card_cover.png" alt="" />
        }

        <img (click)="takeCard()" class="top-card" style="right: 30px" src="assets/img/cards/card_cover.png" alt="" />

        @if (pickCardAnimation) {
        <img (click)="takeCard()" class=" pick-card" style="right: 30px"
            src="assets/img/cards/{{ currentCard }}.png" alt="" />
        }
    </div>
</div>
