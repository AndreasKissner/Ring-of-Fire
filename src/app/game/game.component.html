@for(player of game.players; track player; let i = $index){
<app-player [name]="player" class="player-position" [ngStyle]="{'top.px': 100 + (i * 120)}" style="top: 80px"></app-player>
}


<div class="field">
    <div class="card-stack">
        <!-- Card Stack -->
        @for (c of [0, 1, 2, 3, 4]; track c; let i = $index) {
        <img [ngStyle]="{ 'right.px': i * 5 }" src="assets/img/cards/card_cover.png" alt="" />
        }

        <img (click)="takeCard()" class="top-card" style="right: 30px" src="assets/img/cards/card_cover.png" alt="" />

        <!-- Stack for played card -->
        @for (card of game.playedCards; track card; let i = $index) {
        <img [src]="'assets/img/cards/' + card + '.png'" class="played-card" alt="" />
        }

        <!-- Current card animation -->
        @if (pickCardAnimation) {
        <img (click)="takeCard()" class="pick-card" style="right: 25px"
            [src]="'assets/img/cards/' + currentCard + '.png'" alt="" />
        }
    </div>
</div>
